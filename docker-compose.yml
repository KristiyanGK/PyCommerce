services:
  db:
    image: postgres:16-alpine
    hostname: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pycommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pycommerce}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pycommerce}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pycommerce
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pycommerce}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pycommerce}
      MINIO_BUCKET: ${MINIO_BUCKET:-pycommerce}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
    networks:
      - pycommerce

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_USE_MINIO: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-pycommerce}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pycommerce}
      MINIO_BUCKET: ${MINIO_BUCKET:-pycommerce}
      MINIO_CUSTOM_DOMAIN: ${MINIO_CUSTOM_DOMAIN:-localhost:9000/pycommerce}
    ports:
      - "8000:8000"
    networks:
      - pycommerce
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  minio_data:

networks:
  pycommerce:
    driver: bridge
